<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Content manager · mechanical-turk.dev</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="/admin/config.yml" type="application/yaml" rel="cms-config-url">
  <!-- Language strip: blue English, red Turkish, orange Spanish, green Arabic, purple Russian, gold Chinese. Split when two panes are open. -->
  <style>
    :root { --lang-en: #1d4ed8; --lang-tr: #e30a17; --lang-es: #f97316; --lang-ar: #15803d; --lang-ru: #7c3aed; --lang-zh: #facc15; }
    /* Later rules win: --strip-end ends up as the last open language, --strip-start as the first. With one pane they match. */
    body:has(.content-editor .pane[data-mode="edit"][data-locale="en"]) { --strip-end: var(--lang-en); }
    body:has(.content-editor .pane[data-mode="edit"][data-locale="tr"]) { --strip-end: var(--lang-tr); }
    body:has(.content-editor .pane[data-mode="edit"][data-locale="es"]) { --strip-end: var(--lang-es); }
    body:has(.content-editor .pane[data-mode="edit"][data-locale="ar"]) { --strip-end: var(--lang-ar); }
    body:has(.content-editor .pane[data-mode="edit"][data-locale="ru"]) { --strip-end: var(--lang-ru); }
    body:has(.content-editor .pane[data-mode="edit"][data-locale="zh"]) { --strip-end: var(--lang-zh); }
    body:has(.content-editor .pane[data-mode="edit"][data-locale="zh"]) { --strip-start: var(--lang-zh); }
    body:has(.content-editor .pane[data-mode="edit"][data-locale="ru"]) { --strip-start: var(--lang-ru); }
    body:has(.content-editor .pane[data-mode="edit"][data-locale="ar"]) { --strip-start: var(--lang-ar); }
    body:has(.content-editor .pane[data-mode="edit"][data-locale="es"]) { --strip-start: var(--lang-es); }
    body:has(.content-editor .pane[data-mode="edit"][data-locale="tr"]) { --strip-start: var(--lang-tr); }
    body:has(.content-editor .pane[data-mode="edit"][data-locale="en"]) { --strip-start: var(--lang-en); }
    body:has(.content-editor .pane[data-mode="edit"])::before {
      content: ""; position: fixed; inset: 0 0 auto 0; height: 6px; z-index: 99999; pointer-events: none;
      background: linear-gradient(to right, var(--strip-start) 50%, var(--strip-end) 50%);
    }
    .content-editor .pane[data-mode="edit"][data-locale="en"] { box-shadow: inset 0 4px 0 var(--lang-en); }
    .content-editor .pane[data-mode="edit"][data-locale="tr"] { box-shadow: inset 0 4px 0 var(--lang-tr); }
    .content-editor .pane[data-mode="edit"][data-locale="es"] { box-shadow: inset 0 4px 0 var(--lang-es); }
    .content-editor .pane[data-mode="edit"][data-locale="ar"] { box-shadow: inset 0 4px 0 var(--lang-ar); }
    .content-editor .pane[data-mode="edit"][data-locale="ru"] { box-shadow: inset 0 4px 0 var(--lang-ru); }
    .content-editor .pane[data-mode="edit"][data-locale="zh"] { box-shadow: inset 0 4px 0 var(--lang-zh); }
  </style>
</head>
<body>
  <!-- Sveltia CMS: a free, Git-based CMS. Content is committed to the GitHub repo. -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <!-- Live page preview in the editor (toggle it from the editor toolbar). -->
  <script type="module" src="/admin/preview.js"></script>
</body>
</html>
