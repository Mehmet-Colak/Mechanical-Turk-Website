# ---------------------------------------------------------------------------
# Collections
# ---------------------------------------------------------------------------
collections:
  - name: pages
    label: Pages
    label_singular: Page
    description: "Every page of the site. Add a page, then add it to Settings → Navigation so it appears in the menu."
    folder: content/pages
    extension: json
    format: json
    create: true
    delete: true
    i18n: true
    identifier_field: title
    slug: "{{fields.permalink}}"
    summary: "{{title}}  ·  /{{permalink}}"
    sortable_fields: [title, permalink]
    fields:
      - name: permalink
        label: URL slug
        widget: string
        i18n: duplicate
        pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and dashes only"]
        hint: "The page lives at mechanical-turk.dev/<slug>/ (Turkish: /tr/<slug>/). Use “home” for the front page."
      - { name: title, label: Title, widget: string, i18n: true }
      - {
          name: description,
          label: "Search & social description",
          widget: text,
          required: false,
          i18n: true,
        }
      - {
          name: kicker,
          label: Small label above the title,
          widget: string,
          required: false,
          i18n: true,
        }
      - {
          name: show_title,
          label: Show page title,
          widget: boolean,
          default: true,
          required: false,
          i18n: duplicate,
        }
      - {
          name: intro,
          label: Intro under the title,
          widget: markdown,
          required: false,
          i18n: true,
        }
      - {
          name: show_divider,
          label: Show divider under the title,
          widget: boolean,
          default: true,
          required: false,
          i18n: duplicate,
        }
      - {
          name: divider_motif,
          label: Motif for the divider under the title,
          widget: select,
          required: false,
          i18n: duplicate,
          hint: "(None) uses the site's default motif. [See every motif](https://mechanical-turk.dev/admin/motifs/) (opens the reference sheet).",
          options: *motif_options,
        }
      - {
          name: og_image,
          label: Social share image,
          widget: image,
          required: false,
          i18n: duplicate,
        }
      - {
          name: draft,
          label: "Draft (don’t publish this page)",
          widget: boolean,
          default: false,
          required: false,
          i18n: duplicate,
        }
      - name: blocks
        label: Sections
        label_singular: Section
        widget: list
        i18n: true
        types: *block_types

  - name: data
    label: Data
    description: "Timeline entries and the skills logo grid, shown wherever a Timeline or Skills section is placed."
    format: json
    extension: json
    i18n: true
    files:
      - name: timeline
        label: Timeline
        file: content/timeline.json
        i18n: true
        fields:
          - name: entries
            label: Entries (top to bottom)
            label_singular: Entry
            widget: list
            i18n: true
            summary: "{{fields.date}} · {{fields.title}}"
            fields:
              - {
                  name: date,
                  label: "Date (e.g. Sep 2026)",
                  widget: string,
                  i18n: true,
                }
              - {
                  name: kind_label,
                  label: "Tag (Work, Education, Award…)",
                  widget: string,
                  required: false,
                  i18n: true,
                }
              - { name: title, label: Title, widget: string, i18n: true }
              - {
                  name: org,
                  label: Organization / subtitle,
                  widget: string,
                  required: false,
                  i18n: true,
                }
              - {
                  name: body,
                  label: Description,
                  widget: markdown,
                  required: false,
                  i18n: true,
                }
              - {
                  name: image,
                  label: Image (optional),
                  widget: image,
                  required: false,
                  i18n: duplicate,
                }
              - {
                  name: image_alt,
                  label: Image alt text,
                  widget: string,
                  required: false,
                  i18n: true,
                }
              - {
                  name: image_position,
                  label: Image position,
                  widget: select,
                  default: right,
                  required: false,
                  i18n: duplicate,
                  hint: "Left or right puts the image beside the description on wide screens; on phones it goes above.",
                  options: [{ label: "Above the text", value: top }, { label: "Left of the text", value: left }, { label: "Right of the text", value: right }],
                }
              - {
                  name: more_images,
                  label: More images (optional),
                  label_singular: Image,
                  widget: list,
                  required: false,
                  i18n: true,
                  hint: "Stacked under the image above, in this order. Drag to reorder.",
                  fields: [
                    { name: image, label: Image, widget: image, i18n: duplicate },
                    { name: alt, label: Image alt text, widget: string, required: false, i18n: true },
                  ],
                }
              - {
                  name: link,
                  label: "Link (page slug or URL)",
                  widget: string,
                  required: false,
                  i18n: duplicate,
                }
              - {
                  name: motif,
                  label: Marker motif,
                  widget: select,
                  required: false,
