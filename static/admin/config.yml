            hint: "[See every motif](https://mechanical-turk.dev/admin/motifs/) (opens the reference sheet)."
            options:
              - { label: "Bereket · abundance (border symbol)", value: bereket }
              - { label: "Koç boynuzu · ram’s horn (strength)", value: koc_boynuzu }
              - { label: "Elibelinde · hands on hips (abundance)", value: elibelinde }
              - { label: "Yıldız · star (happiness)", value: yildiz }
              - { label: "Göz · eye (protection)", value: goz }
              - { label: "Muska · amulet (protection)", value: muska }
              - { label: "Pıtrak · burdock (abundance)", value: pitrak }
              - { label: "Doğum · diamond (growth)", value: dogum }
          - name: background
            label: Background colour
            widget: color
            allowInput: true
            required: false
            hint: "Leave empty to use the palette’s burgundy."
          - name: foreground
            label: Symbol colour
            widget: color
            allowInput: true
            required: false
            hint: "Leave empty to use the palette’s saffron."

