        label: Motif art (custom pixel art)
        file: content/settings/motif_art.json
        i18n: false
        description: "Upload your own art to replace any kilim symbol everywhere it appears (dividers, timeline, sidebar mark, tab icon, borders). Use a PNG with a transparent background. Leave a slot empty to keep the built-in drawing. Preview: https://mechanical-turk.dev/admin/motifs/"
        fields:
