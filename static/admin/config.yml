# Sveltia CMS configuration (Decap/Netlify CMS compatible format)
# Docs: https://github.com/sveltia/sveltia-cms
#
# Content lives as JSON files in /content. Saving in the CMS commits to GitHub,
# and Cloudflare Pages rebuilds the site automatically.

backend:
  name: github
  repo: Mehmet-Colak/Mechanical-Turk-Website
  branch: main
  base_url: https://mechanical-turk.dev # OAuth handled by /functions/oauth on Cloudflare Pages
  auth_endpoint: oauth/auth
  commit_messages:
    create: "content: create {{collection}} “{{slug}}”"
    update: "content: update {{collection}} “{{slug}}”"
    delete: "content: delete {{collection}} “{{slug}}”"
    uploadMedia: "media: upload “{{path}}”"
    deleteMedia: "media: delete “{{path}}”"

site_url: https://mechanical-turk.dev
display_url: https://mechanical-turk.dev
logo_url: /favicon.svg
media_folder: static/assets/uploads
public_folder: /assets/uploads

# Languages shown as tabs in the editor. To add Spanish, Arabic, Russian or Chinese:
# 1) add its code here, 2) enable it in Settings → Languages. (README → “Adding a language”)
i18n:
  structure: single_file
  locales: [en, tr]
  default_locale: en

